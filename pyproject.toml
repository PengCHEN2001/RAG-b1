[project]
name = "rag-b1"
version = "0.1.0"
description = "Warhammer 40K RAG chatbot using a rulebook PDF and SQLite unit data"
readme = "README.md"
authors = [
    { name = "jiahua", email = "jiahuazh_07@outlook.com" },
    { name = "PengCHEN", email = "sslchenpeng@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.0",
    "docling>=2.129.0",
    "google-genai>=2.24.0",
    "langchain-core>=1.6.3",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.2.0",
]

[tool.uv]
package = false
